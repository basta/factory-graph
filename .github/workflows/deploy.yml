name: Build and deploy

# Two sites from one Pages deployment: `main` is the live site at /, and the
# `staging` branch is a preview at /staging/. Pages holds a single artifact for
# the whole site, so every deploy builds both — otherwise shipping one would
# wipe the other.
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The interaction tests need a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      # The Pages build is served from /<repo>/, so prove it works there.
      - run: npm run build
        env:
          # No trailing slash, matching what configure-pages hands the deploy
          # job. That difference 404'd the data set on the first live deploy.
          BASE_PATH: /factory-graph
      - run: npm run check:base

  # A push to staging that passes its checks asks main to redeploy. The Pages
  # environment only accepts deploys from the default branch, and the deploy
  # builds staging alongside main anyway.
  stage:
    needs: check
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # One deploy at a time; a newer one supersedes an in-flight one.
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      # A project site is served from /<repo>/, so the asset paths need it.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Staging, built into /staging/ of the same artifact when the branch exists.
      - id: staging
        run: |
          if git ls-remote --exit-code --heads origin staging > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.staging.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging-src
      - if: steps.staging.outputs.exists == 'true'
        working-directory: staging-src
        run: |
          npm ci
          npm run build
          cp -r dist ../dist/staging
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/staging
          # Its own localStorage keys, so it can never rewrite a live plan.
          VITE_CHANNEL: staging

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
